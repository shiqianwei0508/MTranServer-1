# MTranServer Docker 部署
#
# 用法（在仓库根目录执行）:
#   docker compose -f docker/compose.yml up -d
#
# 镜像来源（二选一）:
#   1. 本地构建: 先运行 ./docker/build.sh
#   2. 拉取远程: 将 image 改为已发布的镜像地址
#
# 持久化说明:
#   - ./models 挂载到容器 /app/models，翻译模型持久化在宿主机，
#     容器删除/重建后模型不丢失（强烈建议保留此挂载）。
#   - 服务默认模型目录即为 /app/models（进程 CWD 下的 models/），无需额外设置 MT_MODEL_DIR。

services:
  mtranserver:
    image: xxnuo/mtranserver:latest
    container_name: mtranserver
    restart: unless-stopped
    ports:
      - "8989:8989"
    environment:
      - MT_HOST=0.0.0.0
      - MT_PORT=8989
      - MT_ENABLE_UI=true
      - MT_OFFLINE=false
      # 取消注释以启用 API 认证:
      # - MT_API_TOKEN=your_secret_token_here
    volumes:
      # 翻译模型持久化（强烈建议，避免重建容器后重新下载）:
      - ./docker/models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
